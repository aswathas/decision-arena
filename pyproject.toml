[project]
name = "decision-arena"
version = "0.1.0"
description = "A neutral harness for measuring decision models (Jev, Clef, and the open-weight zoo)"
requires-python = ">=3.9"
dependencies = []          # standard library only, on purpose
license = { text = "Apache-2.0" }

[project.scripts]
decisionarena = "decisionarena.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["decisionarena"]
